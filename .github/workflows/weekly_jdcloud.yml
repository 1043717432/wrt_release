name: Weekly JDCloud IPQ60xx

on:
  schedule:
    # GitHub cron uses UTC: Sunday 02:00 UTC = Sunday 10:00 China time.
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch-build:
    runs-on: ubuntu-24.04
    steps:
      # 每周用 main 分支（跟随 VIKINGYFY/immortalwrt owrt 最新源码）编译一次 RE-CS-07 固件。
      - name: Dispatch JDCloud build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build_wrt.yml',
              ref: 'main',
              inputs: { model: 'jdcloud_ipq60xx_immwrt' }
            })
